[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-sage"
version = "3.0.0"
description = "Three-harness MCP router for Codex, Antigravity, and OpenCode with explicit model delegation and scoped context handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "bioassembly"}
]
keywords = ["mcp", "agent-router", "antigravity", "opencode", "codex", "hybrid-ai", "airgap-firewall", "bioinformatics"]
dependencies = []

[project.scripts]
hybrid-sage-mcp = "plugins.mcp_server:main"

[tool.setuptools]
packages = ["plugins"]
