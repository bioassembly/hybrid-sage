[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-sage"
version = "2.0.0"
description = "Bidirectional MCP router & plugin bridging Google Antigravity and OpenCode with task routing, passive episodic lesson transfer, and a PII/PHI/Secret airgap firewall."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "bioassembly"}
]
keywords = ["mcp", "agent-router", "antigravity", "opencode", "hybrid-ai", "airgap-firewall", "bioinformatics"]
dependencies = []

[project.scripts]
hybrid-sage-mcp = "plugins.mcp_server:main"

[tool.setuptools]
packages = ["plugins"]
